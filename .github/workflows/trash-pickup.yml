name: TRMNL Trash Pickup

on:
  schedule:
    - cron: "39 0 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  send-pickup-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Send to TRMNL
        run: npm start
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
