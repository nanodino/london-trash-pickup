name: TRMNL Trash Pickup

on:
  schedule:
    # Runs every Sunday at 12:00 UTC (8am EDT / 7am EST).
    # Adjust the hour if you want it to land at a different local time —
    # GitHub Actions cron is always UTC and doesn't shift for daylight saving.
    - cron: "0 12 * * 0"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  send-pickup-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Send to TRMNL
        run: npm start
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
